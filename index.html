<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise 🎁</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:"Segoe UI",sans-serif;
    background:linear-gradient(135deg,#12002f,#4b006e,#ff2f92);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* =========================
   STARS
========================= */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.2;
        transform:scale(.5);
    }

    to{
        opacity:1;
        transform:scale(1.5);
    }
}


/* =========================
   GIFT SCREEN
========================= */

.gift-screen{
    text-align:center;
    z-index:5;
    animation:fadeIn 1.5s ease;
}

.gift-title{
    font-size:28px;
    margin-bottom:35px;
    text-shadow:0 0 20px #ff72c8;
}

.gift{
    position:relative;
    width:180px;
    height:150px;
    margin:auto;
    cursor:pointer;
    animation:float 2s ease-in-out infinite;
}

/* Gift Box */

.box{
    position:absolute;
    bottom:0;
    width:180px;
    height:120px;
    background:linear-gradient(135deg,#ff1744,#c51162);
    border-radius:8px;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

/* Vertical Ribbon */

.ribbon-v{
    position:absolute;
    left:70px;
    bottom:0;
    width:40px;
    height:120px;
    background:#ffd600;
}

/* Gift Lid */

.lid{
    position:absolute;
    top:25px;
    left:-10px;
    width:200px;
    height:45px;
    background:linear-gradient(135deg,#ff4081,#f50057);
    border-radius:8px;
    z-index:3;
    transition:1s;
}

/* Horizontal Ribbon */

.ribbon-h{
    position:absolute;
    left:70px;
    top:0;
    width:40px;
    height:45px;
    background:#ffd600;
}

/* Bow */

.bow-left,
.bow-right{
    position:absolute;
    top:0;
    width:45px;
    height:35px;
    background:#ffd600;
    border-radius:50%;
}

.bow-left{
    left:48px;
    transform:rotate(-30deg);
}

.bow-right{
    right:48px;
    transform:rotate(30deg);
}

.bow-center{
    position:absolute;
    top:8px;
    left:78px;
    width:25px;
    height:25px;
    background:#ffea00;
    border-radius:50%;
    z-index:5;
}

.click-text{
    margin-top:35px;
    font-size:18px;
    animation:pulse 1.5s infinite;
}


/* =========================
   BIRTHDAY SCREEN
========================= */

.birthday{
    display:none;
    position:absolute;
    inset:0;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:10;
    padding:20px;
}

.card{
    width:90%;
    max-width:700px;
    padding:45px 25px;
    border-radius:30px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.25);

    box-shadow:0 20px 70px rgba(0,0,0,.4);

    animation:zoomIn 1.2s ease;
}


/* Cake */

.cake{
    font-size:75px;
    animation:bounce 1.5s infinite;
}


/* Happy Birthday */

.happy{
    font-size:45px;
    margin-top:10px;

    background:linear-gradient(
        90deg,
        #ffffff,
        #ffd6f6,
        #ffffff
    );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;

    text-shadow:0 0 25px rgba(255,255,255,.5);
}


/* IMPORTANT:
   Emoji will keep original colors
*/

.happy span{
    -webkit-text-fill-color:initial;
    background:none;
    text-shadow:none;
}


/* Name */

.name{
    font-size:38px;
    font-weight:bold;
    margin:15px 0;

    color:#ffe600;

    text-shadow:
        0 0 10px #ffea00,
        0 0 25px #ffea00;
}


/* Message */

.message{
    font-size:19px;
    line-height:1.8;
    margin-top:15px;
}


/* Last Birthday Line */

.love{
    margin-top:25px;
    font-size:22px;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }
}


@keyframes pulse{

    0%,100%{
        opacity:.5;
    }

    50%{
        opacity:1;
    }
}


@keyframes fadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}


@keyframes zoomIn{

    from{
        opacity:0;
        transform:scale(.3);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


@keyframes bounce{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .gift-title{
        font-size:23px;
    }

    .happy{
        font-size:34px;
    }

    .name{
        font-size:30px;
    }

    .message{
        font-size:16px;
    }

    .cake{
        font-size:65px;
    }

    .love{
        font-size:18px;
    }
}

</style>
</head>


<body>


<!-- =========================
     STARS
========================= -->

<script>

for(let i=0;i<80;i++){

    let star=document.createElement("div");

    star.className="star";

    star.style.left=
        Math.random()*100+"%";

    star.style.top=
        Math.random()*100+"%";

    star.style.animationDelay=
        Math.random()*2+"s";

    document.body.appendChild(star);
}

</script>


<!-- =========================
     GIFT SCREEN
========================= -->

<div class="gift-screen" id="giftScreen">

    <div class="gift-title">
        ✨ I Have A Special Surprise For Sakira Nusrat ✨
    </div>


    <div class="gift" onclick="openGift()">

        <!-- Bow -->

        <div class="bow-left"></div>

        <div class="bow-right"></div>

        <div class="bow-center"></div>


        <!-- Lid -->

        <div class="lid" id="lid">

            <div class="ribbon-h"></div>

        </div>


        <!-- Box -->

        <div class="box">

            <div class="ribbon-v"></div>

        </div>

    </div>


    <div class="click-text">
        🎁 Click The Gift To Open 🎁
    </div>

</div>



<!-- =========================
     BIRTHDAY SCREEN
========================= -->

<div class="birthday" id="birthday">

    <div class="card">


        <!-- Cake -->

        <div class="cake">
            🎂
        </div>
        <!--image-->>
        <div>
            <img src="safu.jpeg" alt="">
        </div>

        <!-- Happy Birthday

        <div class="happy">

            <span>🎉</span>

            HAPPY BIRTHDAY

            <span>🎉</span>

        </div> -->


        <!-- Name

        <div class="name">

            My Dear Sister❤️

        </div> -->


        <!-- Message

        <div class="message">

            আজকের এই বিশেষ দিনে তোমার জন্য
            রইলো অনেক অনেক শুভকামনা। 🌸

            <br><br>

            তোমার জীবনটা যেন সবসময়
            হাসি, আনন্দ, ভালোবাসা আর
            সুন্দর মুহূর্তে ভরে থাকে। ✨

            <br><br>

            তোমার সব স্বপ্ন পূরণ হোক,
            আর প্রতিটি নতুন দিন
            তোমার জন্য আরও সুন্দর হয়ে উঠুক। 💖

        </div> -->


        <!-- Final Message

        <div class="love">

            💕 Once Again, Happy Birthday My Dear Sister 💕

        </div> -->


    </div>

</div>



<script>


/* =========================
   OPEN GIFT
========================= */

function openGift(){

    const lid =
        document.getElementById("lid");

    const giftScreen =
        document.getElementById("giftScreen");

    const birthday =
        document.getElementById("birthday");


    /* Lid Animation */

    lid.style.transform =
        "translateY(-90px) rotate(-8deg)";


    /* Confetti */

    createConfetti();


    /* Show Birthday */

    setTimeout(()=>{

        giftScreen.style.display="none";

        birthday.style.display="flex";

    },1500);

}



/* =========================
   CONFETTI
========================= */

function createConfetti(){

    const emojis=[

        "🎉",
        "🎊",
        "✨",
        "💖",
        "❤️",
        "🌸",
        "⭐",
        "🥳"

    ];


    for(let i=0;i<150;i++){

        let confetti =
            document.createElement("div");


        confetti.innerHTML =
            emojis[
                Math.floor(
                    Math.random()
                    * emojis.length
                )
            ];


        confetti.style.position="fixed";


        confetti.style.left =
            Math.random()*100+"vw";


        confetti.style.top="-50px";


        confetti.style.fontSize =
            (15+Math.random()*25)+"px";


        confetti.style.zIndex="999";


        document.body.appendChild(confetti);


        let duration =
            2000+Math.random()*3000;


        confetti.animate(

            [

                {
                    transform:
                        "translateY(0) rotate(0deg)",

                    opacity:1
                },

                {

                    transform:
                        `translateY(110vh)
                         rotate(${Math.random()*1000}deg)`,

                    opacity:0

                }

            ],

            {

                duration:duration,

                easing:"linear"

            }

        );


        setTimeout(()=>{

            confetti.remove();

        },duration);

    }

}

</script>

</body>
</html>
